# $schema: https://json.schemastore.org/spring-boot-application-yaml
spring:
    application:
        name: portfolio

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
        driver-class-name: org.postgresql.Driver
        username: ${SPRING_DATASOURCE_USERNAME:portfolio}
        password: ${SPRING_DATASOURCE_PASSWORD:portfolio1234}

    jpa:
        show-sql: false
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

server:
    error:
        include-stacktrace: never
        include-message: never


admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}

jwt:
    secret: ${JWT_SECRET:IW|W<CxvtgvK*R7wOzaui(Kewx9ERVGU}
    expiration: ${JWT_EXPIRATION:86400000}
